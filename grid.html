
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout 2</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .container {
            display: grid;
            grid-template-areas:
                "nav header header"
                "nav article article"
                "nav footer footer";

            grid-template-columns: 1fr 2fr 2fr;
            grid-template-rows: 100px 300px 100px;
            gap: 10px;
        }

        header {
            grid-area: header;
            background: lightblue;
        }

        nav {
            grid-area: nav;
            background: lightgreen;
        }

        article {
            grid-area: article;
            background: lightyellow;
        }

        footer {
            grid-area: footer;
            background: lightgray;
        }

        .container > * {
            padding: 20px;
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <nav>Navigation</nav>
        <header>Header</header>
        <article>Article</article>
        <footer>Footer</footer>
    </div>

</body>
</html>
